blueprint:
  name: AWTRIX NG List ToDo Items
  description: >-
    Shows all open items from a to-do list as a pushed app on one or more AWTRIX NG
    displays while a toggle helper is on, and removes the app again when the toggle
    goes off. Built for the AWTRIX NG MQTT API. V1.1
  domain: automation
  homeassistant:
    min_version: 2025.2.0
  input:
    awtrix_displays:
      name: AWTRIX Displays
      description: >-
        Select the target AWTRIX NG displays. Needs HA discovery enabled on each
        device - the blueprint reads its MQTT prefix from the "MQTT prefix" sensor.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
          multiple: true
      default: []
    extra_prefixes:
      name: Extra MQTT prefixes
      description: >-
        Optional. MQTT topic prefixes of displays that are not in Home Assistant -
        the mqttPrefix from their MQTT settings, or the 12-character device uid when
        that field is empty. Commands go to <prefix>/cmd/apps/pushed/<app name>.
      selector:
        text:
          multiple: true
      default: []
    toggle_helper:
      name: Toggle Helper
      description: Select the Toggle Helper that will toggle the App on or off.
      selector:
        entity:
          filter:
            - domain: input_boolean
    my_todo_list:
      name: ToDo List
      description: Select your to-do list.
      selector:
        entity:
          filter:
            - domain: todo
    my_icon:
      name: Icon
      description: Enter the Icon Name or ID of the icon that you like to show.
      selector:
        text:
      default: "29644"
    icon_mode:
      name: Push Icon
      description: Icon behavior.
      selector:
        select:
          options:
            - label: "Icon doesn't move"
              value: "fixed"
            - label: "Icon moves with text and will not appear again"
              value: "pushOnce"
            - label: "Icon moves with text but appears again when the text starts"
              value: "push"
          mode: dropdown
      default: "push"
    my_text:
      name: Custom Text
      description: Text to show when there are no to-do items.
      selector:
        text:
      default: "Relax! You have nothing to do!"
    prefix:
      name: Prefix
      description: Enter a prefix text.
      selector:
        text:
      default: "To Do:"
    show_empty_todo_list:
      name: Show Empty ToDo List
      description: Show the custom text when there are no items.
      selector:
        boolean:
      default: true
    text_case:
      name: Text Case
      description: Select how you would like your text to display.
      selector:
        select:
          options:
            - label: "Use global setting"
              value: "inherit"
            - label: "Force Uppercase"
              value: "upper"
            - label: "Show as you entered it"
              value: "asTyped"
          mode: dropdown
      default: "inherit"
    background_color:
      name: Background Color
      description: Select the Background color.
      selector:
        color_rgb:
      default: [0, 0, 0]
    text_color:
      name: Text Color
      description: Select the Text color.
      selector:
        color_rgb:
      default: [255, 255, 255]
    show_rainbow:
      name: Rainbow Colors
      description: Should the text be shown in Rainbow colors?
      selector:
        boolean:
      default: false
    repeat:
      name: Repeat
      description: >-
        How many times the text is scrolled through the matrix before the app ends.
        0 turns it off and the duration is used instead.
      default: "0"
    duration:
      name: Duration (in seconds)
      description: Sets how long the app should be displayed. 0 is global app time.
      default: "0"
    lifetime:
      name: Lifetime (in seconds)
      description: >-
        How long the app stays alive before it is removed from the app cycle
        automatically. 0 is infinite lifetime.
      default: "0"
    lifetime_expiry:
      name: On lifetime expiry
      description: >-
        What happens when the lifetime runs out. "Remove" drops the app from the
        rotation, "Mark" keeps it and draws a dark red frame around it.
      selector:
        select:
          options:
            - label: "Remove the app"
              value: "remove"
            - label: "Mark the app as stale"
              value: "mark"
          mode: dropdown
      default: "remove"
    switch_to_app:
      name: Switch to app on value change
      description: >-
        Should the clock switch to the app immediately when the to-do list changes?
        BEWARE! This can flood your clock with MQTT messages.
      selector:
        boolean:
      default: false
    scroll:
      name: Scroll the text?
      description: Enables text scrolling.
      selector:
        boolean:
      default: true
    scrollspeed:
      name: Scroll Speed Percentage
      description: Modifies the scrollspeed. You need to enter a percentage value.
      selector:
        number:
          mode: slider
          min: 0
          max: 200
      default: 100
    effect:
      name: Effect
      description: Select a background effect (optional).
      selector:
        select:
          options:
            - label: "None"
              value: ""
            - label: "BrickBreaker"
              value: "BrickBreaker"
            - label: "Checkerboard"
              value: "Checkerboard"
            - label: "ColorWaves"
              value: "ColorWaves"
            - label: "Fade"
              value: "Fade"
            - label: "Fireworks"
              value: "Fireworks"
            - label: "LookingEyes"
              value: "LookingEyes"
            - label: "Matrix"
              value: "Matrix"
            - label: "MovingLine"
              value: "MovingLine"
            - label: "PingPong"
              value: "PingPong"
            - label: "Pacifica"
              value: "Pacifica"
            - label: "Plasma"
              value: "Plasma"
            - label: "PlasmaCloud"
              value: "PlasmaCloud"
            - label: "Radar"
              value: "Radar"
            - label: "Ripple"
              value: "Ripple"
            - label: "Snake"
              value: "Snake"
            - label: "SwirlIn"
              value: "SwirlIn"
            - label: "SwirlOut"
              value: "SwirlOut"
            - label: "TheaterChase"
              value: "TheaterChase"
            - label: "TwinklingStars"
              value: "TwinklingStars"
          mode: dropdown
      default: ""

mode: queued

triggers:
  - trigger: state
    entity_id: !input toggle_helper
    to: "on"
    id: "On"
  - trigger: state
    entity_id: !input toggle_helper
    to: "off"
    id: "Off"
  - trigger: state
    entity_id:
      - !input my_todo_list
    id: "Changes"

variables:
  device_ids: !input awtrix_displays
  extra_prefixes: !input extra_prefixes
  my_todo_list: !input my_todo_list
  my_icon: !input my_icon
  icon_mode: !input icon_mode
  background_color: !input background_color
  text_color: !input text_color
  text_case: !input text_case
  show_rainbow: !input show_rainbow
  my_repeat: !input repeat
  my_duration: !input duration
  my_lifetime: !input lifetime
  lifetime_expiry: !input lifetime_expiry
  switch_to_app: !input switch_to_app
  scrolling: !input scroll
  scroll_speed: !input scrollspeed
  effect: !input effect
  my_text: !input my_text
  my_prefix: !input prefix
  my_show_empty_todo_list: !input show_empty_todo_list
  targets: >-
    {% set ns = namespace(t=[]) %}
    {% for device_id in device_ids %}
      {% set found = device_entities(device_id) | select('search', 'mqtt_prefix') | list %}
      {% if found %}
        {% set ns.t = ns.t + [states(found[0])] %}
      {% endif %}
    {% endfor %}
    {% set ns.t = ns.t + (extra_prefixes | list) %}
    {{ ns.t | map('trim') | reject('in', ['', 'unknown', 'unavailable']) | unique | list }}
  # AWTRIX NG app names must match [A-Za-z0-9_-]{1,32}, so the entity id is sanitised.
  app_name: >-
    {{ (my_todo_list | trim | regex_replace('[^A-Za-z0-9_-]', '_'))[:32] }}
  scroll_obj: >-
    {{ {"mode": "static"} if not scrolling else {"speed": scroll_speed | int(100)} }}

actions:
  - action: todo.get_items
    data:
      status: needs_action
    target:
      entity_id: !input my_todo_list
    response_variable: todo_list
  - variables:
      items_text: >-
        {{ my_prefix }} {% for item in todo_list[my_todo_list]['items'] %}{{ item.summary }}{% if not loop.last %} // {% endif %}{% endfor %}
  - choose:
      - conditions:
          - condition: trigger
            id: "Off"
        sequence:
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                # An empty payload on cmd/apps/pushed/<name> deletes the app.
                - action: mqtt.publish
                  data:
                    qos: 0
                    retain: false
                    topic: "{{ repeat.item ~ '/cmd/apps/pushed/' ~ app_name }}"
                    payload: ""
        alias: Turn Off ToDo List
      - conditions:
          - condition: state
            entity_id: !input toggle_helper
            state: "on"
          - condition: template
            value_template: "{{ todo_list[my_todo_list]['items'] | count == 0 }}"
          - condition: template
            value_template: "{{ my_show_empty_todo_list == false }}"
        sequence:
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: mqtt.publish
                  data:
                    qos: 0
                    retain: false
                    topic: "{{ repeat.item ~ '/cmd/apps/pushed/' ~ app_name }}"
                    payload: ""
        alias: ToDo List is Empty & Do Not Show Empty ToDo List
      - conditions:
          - condition: state
            entity_id: !input toggle_helper
            state: "on"
          - condition: template
            value_template: "{{ todo_list[my_todo_list]['items'] | count == 0 }}"
          - condition: template
            value_template: "{{ my_show_empty_todo_list == true }}"
        sequence:
          - variables:
              app_payload: >-
                {# Home Assistant renders any template entered in "Custom Text" and then
                   applies native-type parsing, so a numeric result comes back as a NUMBER.
                   AWTRIX NG rejects the whole payload when "text" is not a string. #}
                {% set app_text = my_text
                                  if (my_text is sequence and my_text is not string
                                      and my_text is not mapping)
                                  else my_text | string %}
                {{ {
                     "text": app_text,
                     "icon": my_icon | string,
                     "backgroundColor": background_color,
                     "textColor": "palette" if show_rainbow else text_color,
                     "palette": "Rainbow" if show_rainbow else none,
                     "textCase": text_case,
                     "iconMode": icon_mode,
                     "repeat": my_repeat | int(0),
                     "durationMs": (my_duration | int(0)) * 1000,
                     "lifetimeMs": (my_lifetime | int(0)) * 1000,
                     "lifetimeExpiry": lifetime_expiry,
                     "scroll": scroll_obj,
                     "effect": effect
                   } | tojson }}
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: mqtt.publish
                  data:
                    qos: 0
                    retain: false
                    topic: "{{ repeat.item ~ '/cmd/apps/pushed/' ~ app_name }}"
                    payload: "{{ app_payload }}"
                - condition: template
                  value_template: "{{ switch_to_app == true }}"
                - action: mqtt.publish
                  data:
                    qos: 0
                    retain: false
                    topic: "{{ repeat.item ~ '/cmd/apps/switch' }}"
                    payload: "{{ app_name }}"
        alias: ToDo List is Empty & Show Empty ToDo List
      - conditions:
          - condition: state
            entity_id: !input toggle_helper
            state: "on"
          - condition: template
            value_template: "{{ todo_list[my_todo_list]['items'] | count > 0 }}"
        sequence:
          - variables:
              app_payload: >-
                {{ {
                     "text": items_text | string,
                     "icon": my_icon | string,
                     "backgroundColor": background_color,
                     "textColor": "palette" if show_rainbow else text_color,
                     "palette": "Rainbow" if show_rainbow else none,
                     "textCase": text_case,
                     "iconMode": icon_mode,
                     "repeat": my_repeat | int(0),
                     "durationMs": (my_duration | int(0)) * 1000,
                     "lifetimeMs": (my_lifetime | int(0)) * 1000,
                     "lifetimeExpiry": lifetime_expiry,
                     "scroll": scroll_obj,
                     "effect": effect
                   } | tojson }}
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: mqtt.publish
                  data:
                    qos: 0
                    retain: false
                    topic: "{{ repeat.item ~ '/cmd/apps/pushed/' ~ app_name }}"
                    payload: "{{ app_payload }}"
                - action: mqtt.publish
                  data:
                    qos: 0
                    retain: false
                    topic: "{{ repeat.item ~ '/cmd/apps/switch' }}"
                    payload: "{{ app_name }}"
        alias: ToDo List has items
